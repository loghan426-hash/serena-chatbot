<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERENA - Consola de Voz e Historial</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="chatbot-body-layout">
    <div class="app-container">
        
        <!-- Panel Lateral Izquierdo -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>Consola Serena</h3>
                <a href="index.html" class="back-link">← Volver</a>
            </div>
            
            <div class="sidebar-history-title">Historial de Chats</div>
            <div id="historyList" class="history-list">
                <p class="empty-history">Cargando registros...</p>
            </div>

            <!-- Acción de Borrado Completo -->
            <div class="sidebar-footer-actions">
                <button id="btnBorrarHistorial" class="btn-danger-clear">🗑️ Borrar Historial</button>
            </div>
        </aside>

        <!-- Ventana Principal del Chat -->
             <!-- Ventana Principal del Chat -->
        <main class="chat-area">
            <header class="chat-header">
                <div class="serena-status">
                    <div class="serena-core"></div>
                    <div>
                        <h2>SERENA CORE</h2>
                        <span class="status-text">Sistemas en equilibrio - Contención Activa</span>
                    </div>
                </div>

                <!-- ANIMACIÓN DE ONDAS DE SONIDO -->
                <div id="waveContainer" class="sound-wave">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </header>


            <div id="chatMessages" class="chat-messages">
                <div class="msg message-bot">
                    <p>Conexión establecida. Mis canales de audio e historial interactivo de SERENA están listos. Haz clic en una conversación pasada para reanudarla.</p>
                </div>
            </div>

            <footer class="chat-footer">
                <form id="chatForm">
                    <button type="button" id="btnVoice" class="btn-voice" title="Hablar con SERENA">🎤</button>
                    <input type="text" id="userInput" placeholder="Escribe un comando o usa el micrófono..." autocomplete="off" required>
                    <button type="submit" class="btn-send">Enviar</button>
                </form>
            </footer>
        </main>

    </div>

    <script src="main.js"></script>
</body>
</html>
