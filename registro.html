<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERENA - Registrarse</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
    <div class="login-container">
        <h2>Crear Cuenta</h2>
        <p class="subtitle">Únete a un ecosistema digital inteligente</p>
        
        <form id="registroForm">
            <div class="input-group">
                <label for="usuario">Nuevo Usuario</label>
                <input type="text" id="usuario" required placeholder="Elige un nombre de usuario">
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="Crea una contraseña segura">
            </div>
            <button type="submit" class="btn-primary">Registrar Cuenta</button>
            <p id="message" class="error-text" style="color: #5eead4;"></p>
            <p style="text-align:center; margin-top:1.5rem; font-size:0.85rem;">
                <a href="login.html" style="color: var(--text-muted); text-decoration:none;">¿Ya tienes cuenta? Inicia sesión</a>
            </p>
        </form>
    </div>

    <script>
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');

            const res = await fetch('/api/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, password })
            });
            const data = await res.json();

            if (data.success) {
                msg.textContent = "¡Registro exitoso! Redirigiendo...";
                msg.style.color = "#5eead4";
                msg.style.opacity = 1;
                setTimeout(() => window.location.href = '/login.html', 1500);
            } else {
                msg.textContent = data.message;
                msg.style.color = "#f87171";
                msg.style.opacity = 1;
            }
        });
    </script>
</body>
</html>
